# ──────────────────────────────────────────────────────────
# Docker Compose — Leave Management System
# Services: backend API, frontend SPA, MySQL database
# ──────────────────────────────────────────────────────────

version: "3.8"

services:
  # ── MySQL Database ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: leavems-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-leave_management}
      MYSQL_USER: ${DB_USER:-leavems}
      MYSQL_PASSWORD: ${DB_PASSWORD:-leavems_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leavems-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-leave_management}
      DB_USER: ${DB_USER:-leavems}
      DB_PASSWORD: ${DB_PASSWORD:-leavems_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@leavemanagement.com}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend SPA ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leavems-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - BACKEND_URL=http://localhost:5000

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local
