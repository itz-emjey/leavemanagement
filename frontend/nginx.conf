# ──────────────────────────────────────────────────────────
# nginx configuration — Leave Management System Frontend
# Serves the built SPA and injects runtime API URL
# API calls go directly to the backend via CORS (no proxy)
# ──────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # ── Gzip compression ──────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Static files root ─────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Runtime API URL config (injects BACKEND_URL for direct API calls, bypassing nginx proxy)
    location = /config.js {
        add_header Content-Type application/javascript;
        return 200 'window.API_URL = "${BACKEND_URL}";';
    }

    # ── SPA routing — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;

        # Cache control for static assets with hashed filenames
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|ico|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }



    # ── Deny access to hidden files ───────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Error pages ───────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
