# ──────────────────────────────────────────────────────────
# nginx configuration — Leave Management System Frontend
# Serves the built SPA and proxies API calls to the backend
# ──────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # ── Gzip compression ──────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Static files root ─────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;

        # Cache control for static assets with hashed filenames
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|ico|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── API proxy to backend ──────────────────────────────
    location /api/ {
        set $backend_url "http://backend.railway.internal:8080";
        proxy_pass $backend_url/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Requested-With XMLHttpRequest;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ── WebSocket proxy for Socket.IO ─────────────────────
    location /socket.io/ {
        set $backend_url "http://backend.railway.internal:8080";
        proxy_pass $backend_url/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
    }

    # ── Uploaded files ────────────────────────────────────
    location /uploads/ {
        set $backend_url "http://backend.railway.internal:8080";
        proxy_pass $backend_url/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny access to hidden files ───────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Error pages ───────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
